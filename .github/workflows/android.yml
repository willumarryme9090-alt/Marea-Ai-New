name: Build Marea AI debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marea-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: false

      - name: Check project files
        shell: bash
        run: |
          echo "Checking Marea AI project..."

          test -f settings.gradle.kts || {
            echo "::error::settings.gradle.kts is missing from the project root."
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "::error::app/build.gradle.kts is missing."
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          }

          echo "Project files found."

      - name: Prepare Gradle wrapper if missing
        shell: bash
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Gradle wrapper is missing. Generating it..."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

      - name: Show Java and Gradle versions
        shell: bash
        run: |
          java -version
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not generated."
            echo "Available APK files:"
            find app/build/outputs -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload Marea AI APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Marea-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Marea-AI-build-logs
          path: |
            app/build/reports/
            app/build/outputs/logs/
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
