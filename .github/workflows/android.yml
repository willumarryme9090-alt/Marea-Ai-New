name: Build Marea AI debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate project structure
        shell: bash
        run: |
          set -e
          for f in settings.gradle.kts build.gradle.kts gradle.properties \
                   app/build.gradle.kts app/src/main/AndroidManifest.xml \
                   app/src/main/res/drawable-nodpi/marea_character.webp; do
            if [ ! -f "$f" ]; then echo "::error::Missing required file: $f"; exit 1; fi
          done
          grep -q 'include(":app")' settings.gradle.kts || { echo "::error::Module :app not included"; exit 1; }
          echo "Project structure OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marea-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload logs and test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marea-ai-build-logs
          path: |
            build.log
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
